<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>농협은행 소나기 게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    
    body { 
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px;
    }

    .main-wrapper {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      max-width: 1060px;
      width: 100%;
    }

    .game-container { 
      flex: 1;
      height: 740px; 
      background: rgba(30, 41, 59, 0.7); 
      backdrop-filter: blur(12px);
      border-radius: 16px; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15), 0 20px 40px rgba(0,0,0,0.6); 
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative; 
    }

    .header { 
      padding: 16px 24px; 
      background: rgba(15, 23, 42, 0.85); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
    }
    .stat-box { font-size: 14px; font-weight: 600; color: #94a3b8; }
    .stat-box span { color: #38bdf8; font-size: 18px; font-weight: 700; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .combo-badge { color: #fbbf24 !important; text-shadow: 0 0 10px rgba(251, 191, 36, 0.6) !important; }

    .game-area { 
      flex: 1; 
      position: relative; 
      overflow: hidden; 
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.4) 0%, rgba(2, 6, 23, 0.8) 100%);
    }

    .word-item { 
      position: absolute; 
      background: rgba(30, 41, 59, 0.9); 
      color: #38bdf8; 
      padding: 7px 16px; 
      border-radius: 20px; 
      font-size: 14px; 
      font-weight: 700; 
      border: 1px solid #38bdf8; 
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
      white-space: nowrap; 
      transition: background 0.15s, border-color 0.15s, transform 0.15s; 
    }
    .word-item.danger { 
      background: rgba(225, 29, 72, 0.9); 
      color: #fff;
      border-color: #fb7185; 
      box-shadow: 0 0 18px rgba(244, 63, 94, 0.8);
      animation: pulse 0.4s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .ground-line { 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 4px; 
      background: #f43f5e; 
      box-shadow: 0 0 15px #f43f5e;
    }

    .footer { 
      padding: 16px 24px; 
      background: rgba(15, 23, 42, 0.9); 
      display: flex; 
      border-top: 1px solid rgba(255, 255, 255, 0.08); 
    }
    .input-box { 
      flex: 1; 
      padding: 14px 20px; 
      border-radius: 10px; 
      border: 2px solid #334155; 
      background: #0f172a; 
      color: #fff; 
      font-size: 16px; 
      outline: none; 
      transition: all 0.2s ease;
    }
    .input-box:focus { 
      border-color: #38bdf8; 
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); 
    }

    .info-panel {
      width: 320px;
      height: 740px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    .info-panel-title {
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .desc-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #0284c7;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.3);
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .desc-card.active {
      opacity: 1;
      transform: translateY(0);
    }
    .desc-card .tag {
      display: inline-block;
      font-size: 11px;
      background: #0369a1;
      color: #e0f2fe;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .desc-card h3 {
      font-size: 20px;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    .desc-card p {
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
      word-break: keep-all;
    }

    .placeholder-text {
      color: #475569;
      font-size: 14px;
      text-align: center;
      margin-top: 150px;
      line-height: 1.6;
    }

    .overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(15, 23, 42, 0.94); 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      gap: 16px; 
      z-index: 10; 
    }
    .overlay h2 { font-size: 28px; color: #38bdf8; text-shadow: 0 0 15px rgba(56,189,248,0.5); }
    .overlay p { font-size: 15px; color: #cbd5e1; }
    .overlay button { 
      padding: 14px 36px; 
      background: linear-gradient(135deg, #0284c7, #2563eb); 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.2s; 
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.5);
    }
    .overlay button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.8);
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="game-container">
    <div class="header">
      <div class="stat-box">점수: <span id="score">0</span></div>
      <div class="stat-box">콤보: <span id="combo" class="combo-badge">0</span></div>
      <div class="stat-box">라이프: <span id="lives">❤️❤️❤️❤️❤️</span></div>
      <div class="stat-box">레벨: <span id="level">1</span></div>
    </div>

    <div class="game-area" id="gameArea">
      <div class="ground-line"></div>
    </div>

    <div class="footer">
      <input type="text" id="wordInput" class="input-box" placeholder="단어를 입력하고 Enter를 누르세요" autocomplete="off" disabled />
    </div>

    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">농협은행 소나기 게임</h2>
      <p id="overlayDesc">단어가 바닥에 닿기 전에 신속하게 타이핑하세요!</p>
      <button id="startBtn" onclick="startGame()">게임 시작</button>
    </div>
  </div>

  <div class="info-panel">
    <div class="info-panel-title">💡 맞춘 단어 실시간 해설</div>
    <div id="infoContent">
      <p class="placeholder-text">정답을 맞추면 이곳에<br>IT 및 AI 용어 해설이 표시됩니다.</p>
    </div>
  </div>
</div>

<script>
  const wordDict = [
    { word: "가상화", cat: "인프라", desc: "물리적 서버 자원을 논리적으로 분할하여 여러 대의 가상 머신(VM)을 실행할 수 있게 하는 기술입니다." },
    { word: "로드밸런서", cat: "네트워크", desc: "서버에 가해지는 대량의 트래픽을 여러 대의 서버로 고르게 분산하여 서버 과부하를 방지합니다." },
    { word: "서버호스팅", cat: "인프라", desc: "데이터 센터의 물리적 단독 서버 장비를 고객에게 임대하고 운영 환경을 제공하는 서비스입니다." },
    { word: "인공신경망", cat: "AI", desc: "인간의 뇌 신경세포(뉴런) 작동 원리를 모방하여 컴퓨터가 데이터 패턴을 학습하도록 만든 알고리즘입니다." },
    { word: "대규모언어모델", cat: "AI", desc: "방대한 텍스트 데이터를 학습하여 인간 수준의 자연어 이해 및 생성 능력을 갖춘 거대 인공지능 모델(LLM)입니다." },
    { word: "프롬프트", cat: "AI", desc: "생성형 AI 모델로부터 원하는 최적의 답변을 이끌어내기 위해 입력하는 구체적인 지시어나 질문입니다." },
    { word: "클라우드", cat: "인프라", desc: "인터넷을 통해 컴퓨팅 파워, 스토리지, 데이터베이스 등 IT 자원을 필요할 때 유연하게 빌려 쓰는 기술입니다." },
    { word: "고가용성", cat: "인프라", desc: "서버나 시스템에 장애가 발생하더라도 서비스가 중단되지 않고 지속적으로 정상 운영될 수 있는 능력(HA)입니다." },
    { word: "데이터파이프라인", cat: "데이터", desc: "다양한 소스에서 수집된 데이터를 가공, 정제하여 분석 및 저장소로 자동 이동시키는 일련의 시스템입니다." },
    { word: "컨테이너", cat: "인프라", desc: "애플리케이션과 실행에 필요한 라이브러리를 하나로 묶어 어떤 환경에서도 동일하게 배포/실행하는 경량 가상화 기술입니다." },
    { word: "쿠버네티스", cat: "인프라", desc: "대규모 컨테이너화된 애플리케이션의 배포, 확장 및 관리를 자동화해 주는 오케스트레이션 플랫폼입니다." },
    { word: "오케스트레이션", cat: "인프라", desc: "복잡한 컴퓨터 시스템, 미들웨어, 서비스 및 가상 인프라의 설정과 관리를 자동화하고 조율하는 기술입니다." },
    { word: "트랜스포머", cat: "AI", desc: "문장 내 단어 간의 연관성(어텐션 메커니즘)을 병렬로 파악하여 현대 언어모델 혁신을 이끈 딥러닝 아키텍처입니다." },
    { word: "모니터링", cat: "운영", desc: "서버의 CPU, 메모리, 네트워크 트래픽 등 성능 및 가용 상태를 실시간으로 감시하고 이상을 감지하는 작업입니다." },
    { word: "로드밸런싱", cat: "네트워크", desc: "특정 서버에 부하가 집중되지 않도록 유입되는 네트워크 요청을 다수의 서버 풀로 분배하는 기법입니다." },
    { word: "캐싱", cat: "인프라", desc: "자주 접근하는 데이터를 속도가 빠른 임시 저장 메모리에 보관하여 데이터 응답 속도를 비약적으로 향상시키는 방법입니다." },
    { word: "방화벽", cat: "보안", desc: "신뢰할 수 없는 외부 네트워크로부터 내부 네트워크를 보호하기 위해 접근 트래픽을 감시하고 제어하는 보안 시스템입니다." },
    { word: "디스크배열", cat: "스토리지", desc: "여러 개의 물리 디스크를 결합(RAID)하여 데이터의 안정성(백업)과 읽기/쓰기 속도를 향상시키는 저장 장치 구조입니다." },
    { word: "메모리누수", cat: "시스템", desc: "프로그램이 사용한 메모리를 정상적으로 반환하지 않아 시간이 지날수록 점유 메모리가 늘어나 시스템이 멈추는 현상입니다." },
    { word: "장애복구", cat: "운영", desc: "천재지변이나 시스템 치명적 오류로 서비스가 중단되었을 때 백업 자원을 활용해 신속히 원상태로 복원하는 계획(DR)입니다." },
    { word: "하이브리드클라우드", cat: "인프라", desc: "자체 구축한 온프레미스 프라이빗 클라우드와 외부 퍼블릭 클라우드를 상호 연결해 보안과 확장성을 동시에 챙기는 환경입니다." },
    { word: "파인튜닝", cat: "AI", desc: "이미 학습된 대형 AI 사전학습 모델에 특정 도메인(금융, 의료 등) 데이터를 추가로 미세 조정 학습시키는 기법입니다." },
    { word: "스토리지풀", cat: "스토리지", desc: "물리적으로 분산된 다수의 저장 공간을 논리적인 하나의 거대한 저장소로 묶어 유연하게 할당하는 기술입니다." },
    { word: "마이크로서비스", cat: "아키텍처", desc: "하나의 거대한 애플리케이션을 작고 독립적으로 배포 가능한 여러 개의 모듈 서비스 단위로 나누어 구축하는 구조입니다." }
    { word: "검색증강생성", cat: "AI (RAG)", desc: "AI가 답변을 생성할 때 외부 신뢰할 수 있는 지식 베이스 문서를 실시간 검색하여 참조하는 기술(RAG)입니다." },
    { word: "할루시네이션", cat: "AI", desc: "언어모델이 잘못된 정보나 사실이 아닌 내용을 마치 진짜 사실인 것처럼 그럴듯하게 지어내는 환각 현상입니다." },
    { word: "에이아이거버넌스", cat: "AI/윤리", desc: "기업이나 기관에서 AI 시스템의 안전성, 신뢰성, 공정성 및 법적 규제 준수를 체계적으로 관리·감독하는 정책 틀입니다." },
    { word: "벡터디비", cat: "AI/DB", desc: "비정형 데이터(텍스트, 이미지)를 다차원 벡터 임베딩으로 변환하여 유사도 검색을 고속으로 수행하는 특화 DB입니다." },
    { word: "임베딩", cat: "AI", desc: "자연어 단어나 문장을 컴퓨터가 연산할 수 있도록 다차원의 고밀도 실수 벡터값으로 수치화하는 기술입니다." },
    { word: "에이전트", cat: "AI", desc: "스스로 주변 환경을 인식하고, 추론하며, 도구(API 검색 등)를 직접 호출하여 목표 과업을 자율적으로 완수하는 AI 시스템입니다." },
    { word: "온디바이스", cat: "AI/인프라", desc: "클라우드 서버와 통신하지 않고 스마트폰, PC 등 단말기 자체 칩셋에서 독립적으로 AI 연산을 처리하는 방식입니다." },
    { word: "양자화", cat: "AI/최적화", desc: "AI 모델의 가중치 부동소수점 정밀도(FP16 -> INT8/INT4)를 낮춰 연산 속도를 높이고 메모리 사용량을 줄이는 경량화 기법입니다." },
    { word: "가드레일", cat: "AI/보안", desc: "LLM이 유해한 질문에 답하거나 민감 정보(개인정보)를 유출하지 않도록 입출력을 검증하고 필터링하는 안전 제어 장치입니다." },
    { word: "멀티모달", cat: "AI", desc: "텍스트뿐만 아니라 이미지, 음성, 비디오 등 다양한 형태의 데이터 유형을 동시에 이해하고 처리하는 인공지능 모델입니다." },
    { word: "인간피드백강화학습", cat: "AI/학습", desc: "인간 평가자의 피드백 점수(보상 모델)를 바탕으로 언어모델의 출력 품질과 안전성을 조율하는 강화학습 기법(RLHF)입니다." },
    { word: "토큰화", cat: "AI", desc: "입력된 텍스트 문장을 AI가 처리하기 쉬운 최소 의미 단위인 토큰(Token) 조각으로 쪼개는 전처리 과정입니다." },
    { word: "추론엔진", cat: "AI/인프라", desc: "학습 완료된 딥러닝 모델에 새로운 데이터를 입력받아 최적화된 저지연 속도로 결과를 계산해 내는 전용 런타임 시스템입니다." },
    { word: "프롬프트엔지니어링", cat: "AI", desc: "생성형 AI 모델로부터 최상의 품질과 정확한 출력을 유도하기 위해 질문과 지시문을 정교하게 설계하고 최적화하는 기법입니다." },
    { word: "인공지능옵스", cat: "운영 (AIOps)", desc: "빅데이터와 머신러닝 기술을 IT 운영에 적용해 시스템 이상 징후를 조기에 감지하고 장애 분석을 자동화하는 방식입니다." },
    { word: "지식그래프", cat: "AI/데이터", desc: "세상의 지식과 엔티티 간의 관계를 노드(개념)와 엣지(관계) 형태의 네트워크 그래프로 모델링한 데이터 구조입니다." },
    { word: "합성데이터", cat: "AI/데이터", desc: "실제 개인정보 노출 위험 없이 AI를 학습시키기 위해 알고리즘을 통해 인위적으로 생성해 낸 모조 데이터셋입니다." },
    { word: "컨텍스트윈도우", cat: "AI", desc: "대규모 언어모델이 한 번의 대화나 추론 시 기억하고 처리할 수 있는 최대 토큰(단어 조각) 입력 용량입니다." },
    { word: "엠엘옵스", cat: "AI/인프라", desc: "머신러닝 모델의 개발, 학습, 테스트, 배포 및 모니터링 라이프사이클 전체를 자동화하고 관리하는 엔지니어링 체계(MLOps)입니다." },
    { word: "신경망가속기", cat: "하드웨어", desc: "딥러닝의 행렬 연산을 고속/저전력으로 처리하기 위해 특별히 설계된 전용 반도체 칩(NPU)입니다." },
    { word: "제로샷러닝", cat: "AI/학습", desc: "모델이 사전에 특정 작업에 대한 명시적 훈련 예시를 전혀 보지 않고도 일반적인 지시만으로 과제를 수행해 내는 능력입니다." }
  ];

  // Web Audio API 효과음 생성기
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playHitSound(currentCombo) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    // 콤보가 올라갈수록 톤이 살짝 높아짐
    const baseFreq = 523.25; // C5
    const pitchMultiplier = Math.min(2.0, 1 + (currentCombo * 0.05));
    
    osc.type = "sine";
    osc.frequency.setValueAtTime(baseFreq * pitchMultiplier, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * pitchMultiplier * 1.5, audioCtx.currentTime + 0.12);

    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  }

  function playMissSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);

    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }

  let score = 0, combo = 0, lives = 5, level = 1;
  let wordsOnScreen = [];
  let gameInterval, spawnInterval;
  let isRunning = false;

  const gameArea = document.getElementById("gameArea");
  const wordInput = document.getElementById("wordInput");
  const scoreEl = document.getElementById("score");
  const comboEl = document.getElementById("combo");
  const livesEl = document.getElementById("lives");
  const levelEl = document.getElementById("level");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayDesc = document.getElementById("overlayDesc");
  const startBtn = document.getElementById("startBtn");
  const infoContent = document.getElementById("infoContent");

  // 화면에 없는 단어만 골라 스폰 (중복 방지)
  function spawnWord() {
    if (!isRunning) return;

    const currentScreenTexts = wordsOnScreen.map(w => w.data.word);
    const availablePool = wordDict.filter(item => !currentScreenTexts.includes(item.word));

    // 모든 단어가 화면에 떠있는 극단적인 경우를 대비한 fallback
    const targetItem = (availablePool.length > 0)
      ? availablePool[Math.floor(Math.random() * availablePool.length)]
      : wordDict[Math.floor(Math.random() * wordDict.length)];

    const el = document.createElement("div");
    el.className = "word-item";
    el.innerText = targetItem.word;

    const areaWidth = gameArea.clientWidth - 140;
    const x = Math.max(15, Math.floor(Math.random() * areaWidth));
    el.style.left = `${x}px`;
    el.style.top = "0px";

    gameArea.appendChild(el);

    // 속도 밸런스 조정: 1.5 시작, 레벨당 0.3 증가
    wordsOnScreen.push({
      el,
      data: targetItem,
      y: 0,
      speed: 1.5 + (level * 0.3)
    });
  }

  function gameLoop() {
    const maxHeight = gameArea.clientHeight - 40;

    for (let i = wordsOnScreen.length - 1; i >= 0; i--) {
      const item = wordsOnScreen[i];
      item.y += item.speed;
      item.el.style.top = `${item.y}px`;

      if (item.y > maxHeight - 80) {
        item.el.classList.add("danger");
      }

      if (item.y >= maxHeight) {
        gameArea.removeChild(item.el);
        wordsOnScreen.splice(i, 1);
        handleMiss();
      }
    }
  }

  function handleMiss() {
    playMissSound();
    lives--;
    combo = 0;
    updateUI();
    if (lives <= 0) gameOver();
  }

  function updateUI() {
    scoreEl.innerText = score.toLocaleString();
    comboEl.innerText = combo;
    levelEl.innerText = level;
    livesEl.innerText = "❤️".repeat(Math.max(0, lives));
  }

  function showDescription(data) {
    infoContent.innerHTML = `
      <div class="desc-card active">
        <span class="tag">${data.cat}</span>
        <h3>${data.word}</h3>
        <p>${data.desc}</p>
      </div>
    `;
  }

  wordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const val = wordInput.value.trim();
      wordInput.value = "";

      const idx = wordsOnScreen.findIndex((w) => w.data.word === val);
      if (idx !== -1) {
        const matched = wordsOnScreen[idx];
        gameArea.removeChild(matched.el);
        wordsOnScreen.splice(idx, 1);

        // 효과음 및 해설
        playHitSound(combo);
        showDescription(matched.data);

        combo++;
        score += 20 + (combo * 5);

        // 레벨업 (400점 단위)
        if (score >= level * 400) {
          level++;
          clearInterval(spawnInterval);
          const newSpawnRate = Math.max(700, 1500 - (level * 100));
          spawnInterval = setInterval(spawnWord, newSpawnRate);
        }
        updateUI();
      }
    }
  });

  function startGame() {
    initAudio();
    score = 0; combo = 0; lives = 5; level = 1;
    wordsOnScreen.forEach(w => gameArea.removeChild(w.el));
    wordsOnScreen = [];
    isRunning = true;
    updateUI();

    infoContent.innerHTML = `<p class="placeholder-text">정답을 맞추면 이곳에<br>IT 및 AI 용어 해설이 표시됩니다.</p>`;

    overlay.style.display = "none";
    wordInput.disabled = false;
    wordInput.value = "";
    wordInput.focus();

    clearInterval(gameInterval);
    clearInterval(spawnInterval);

    gameInterval = setInterval(gameLoop, 30);
    spawnInterval = setInterval(spawnWord, 1500); // 1.5초 주기 스폰
  }

  function gameOver() {
    isRunning = false;
    clearInterval(gameInterval);
    clearInterval(spawnInterval);
    wordInput.disabled = true;

    overlayTitle.innerText = "GAME OVER";
    overlayDesc.innerHTML = `최종 점수: <strong>${score.toLocaleString()}점</strong> | 도달 레벨: <strong>Lv.${level}</strong>`;
    startBtn.innerText = "다시 도전하기";
    overlay.style.display = "flex";
  }
</script>
</body>
</html>
