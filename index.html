<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT 인프라 & AI 소나기 타자 게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .game-container { width: 680px; height: 720px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
    .header { padding: 16px 24px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
    .stat-box { font-size: 15px; font-weight: 600; color: #94a3b8; }
    .stat-box span { color: #38bdf8; font-size: 18px; }
    .combo-badge { color: #f59e0b; font-weight: bold; }
    .game-area { flex: 1; position: relative; overflow: hidden; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); }
    .word-item { position: absolute; background: #334155; color: #f8fafc; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; border: 1px solid #475569; white-space: nowrap; transition: background 0.2s; }
    .word-item.danger { background: #e11d48; border-color: #f43f5e; }
    .ground-line { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #ef4444; }
    .footer { padding: 16px 24px; background: #0f172a; display: flex; gap: 12px; border-top: 2px solid #334155; }
    .input-box { flex: 1; padding: 12px 16px; border-radius: 8px; border: 2px solid #334155; background: #1e293b; color: #fff; font-size: 16px; outline: none; }
    .input-box:focus { border-color: #38bdf8; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
    .overlay button { padding: 12px 28px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .overlay button:hover { background: #0369a1; }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div class="stat-box">점수: <span id="score">0</span></div>
    <div class="stat-box">콤보: <span id="combo" class="combo-badge">0</span></div>
    <div class="stat-box">라이프: <span id="lives">❤️❤️❤️❤️❤️</span></div>
    <div class="stat-box">레벨: <span id="level">1</span></div>
  </div>

  <div class="game-area" id="gameArea">
    <div class="ground-line"></div>
  </div>

  <div class="footer">
    <input type="text" id="wordInput" class="input-box" placeholder="단어를 입력하고 Enter를 누르세요" autocomplete="off" disabled />
  </div>

  <div class="overlay" id="startOverlay">
    <h2>IT & AI 인프라 소나기</h2>
    <p>단어가 바닥에 닿기 전에 입력하세요!</p>
    <button onclick="startGame()">게임 시작</button>
  </div>
</div>

<script>
  const wordList = [
    "가상화", "로드밸런서", "서버호스팅", "인공신경망", "대규모언어모델", 
    "프롬프트", "클라우드", "고가용성", "데이터파이프라인", "컨테이너", 
    "쿠버네티스", "오케스트레이션", "트랜스포머", "모니터링", "로드밸런싱", 
    "캐싱", "방화벽", "디스크배열", "메모리누수", "장애복구", 
    "하이브리드클라우드", "파인튜닝", "임베딩", "스토리지풀", "마이크로서비스"
  ];

  let score = 0, combo = 0, lives = 5, level = 1;
  let wordsOnScreen = [];
  let gameInterval, spawnInterval;
  let isRunning = false;

  const gameArea = document.getElementById("gameArea");
  const wordInput = document.getElementById("wordInput");
  const scoreEl = document.getElementById("score");
  const comboEl = document.getElementById("combo");
  const livesEl = document.getElementById("lives");
  const levelEl = document.getElementById("level");
  const overlay = document.getElementById("startOverlay");

  function spawnWord() {
    if (!isRunning) return;
    const text = wordList[Math.floor(Math.random() * wordList.length)];
    const el = document.createElement("div");
    el.className = "word-item";
    el.innerText = text;

    const areaWidth = gameArea.clientWidth - 120;
    const x = Math.max(10, Math.floor(Math.random() * areaWidth));
    el.style.left = `${x}px`;
    el.style.top = "0px";

    gameArea.appendChild(el);
    wordsOnScreen.push({ el, text, y: 0, speed: 1.2 + (level * 0.3) });
  }

  function gameLoop() {
    for (let i = wordsOnScreen.length - 1; i >= 0; i--) {
      const item = wordsOnScreen[i];
      item.y += item.speed;
      item.el.style.top = `${item.y}px`;

      const maxHeight = gameArea.clientHeight - 35;
      if (item.y > maxHeight - 60) item.el.classList.add("danger");

      if (item.y >= maxHeight) {
        gameArea.removeChild(item.el);
        wordsOnScreen.splice(i, 1);
        handleMiss();
      }
    }
  }

  function handleMiss() {
    lives--;
    combo = 0;
    updateUI();
    if (lives <= 0) gameOver();
  }

  function updateUI() {
    scoreEl.innerText = score;
    comboEl.innerText = combo;
    levelEl.innerText = level;
    livesEl.innerText = "❤️".repeat(Math.max(0, lives));
  }

  wordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const val = wordInput.value.trim();
      wordInput.value = "";
      
      const idx = wordsOnScreen.findIndex((w) => w.text === val);
      if (idx !== -1) {
        const item = wordsOnScreen[idx];
        gameArea.removeChild(item.el);
        wordsOnScreen.splice(idx, 1);

        combo++;
        score += 10 + (combo * 5);
        if (score >= level * 300) {
          level++;
          clearInterval(spawnInterval);
          spawnInterval = setInterval(spawnWord, Math.max(800, 2000 - (level * 150)));
        }
        updateUI();
      }
    }
  });

  function startGame() {
    score = 0; combo = 0; lives = 5; level = 1;
    wordsOnScreen.forEach(w => gameArea.removeChild(w.el));
    wordsOnScreen = [];
    isRunning = true;
    updateUI();

    overlay.style.display = "none";
    wordInput.disabled = false;
    wordInput.focus();

    clearInterval(gameInterval);
    clearInterval(spawnInterval);
    gameInterval = setInterval(gameLoop, 30);
    spawnInterval = setInterval(spawnWord, 1800);
  }

  function gameOver() {
    isRunning = false;
    clearInterval(gameInterval);
    clearInterval(spawnInterval);
    wordInput.disabled = true;
    overlay.innerHTML = `
      <h2>게임 오버!</h2>
      <p>최종 점수: <strong>${score}점</strong> | 최고 콤보: <strong>${combo}</strong></p>
      <button onclick="startGame()">다시 시작</button>
    `;
    overlay.style.display = "flex";
  }
</script>
</body>
</html>
